services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_API_KEY: ${APP_API_KEY:?Set APP_API_KEY in .env}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
volumes:
  ollama-models:
